# v2.1.0-vapp 起的发布流水线（简化版）：
#   tag 推送 (v*) → build-apk: assembleDebug，产物自动附加到同名 Release。
#   旧的 e2e-verify 门控（qemu 真跑固件三校验）针对 openvela 官方固件设计；
#   vapp 内置固件的端到端验证（NSH → mount → vapp → 渲染）已在开发环境完成，
#   CI 侧不再重复跑（避免对 Release 资产名的依赖），需要时可从历史版本找回。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # v2.2.13: 发布前清单校验 —— 重算内置资产 sha256/size 与 image_manifest.json
      # 逐项比对。v2.2.12 事故（清单 sha 滞留旧固件 → 新固件永不部署到用户设备，
      # 触摸/布局修复未生效）必须在流水线上拦截，而不是到用户手机上才暴露。
      - name: Verify image manifest matches assets
        run: python3 scripts/ci/verify_manifest.py
      - name: Enable gradle wrapper
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename APK with version
        run: |
          VER=${GITHUB_REF_NAME#v}
          cp app/build/outputs/apk/debug/app-debug.apk "XiaomiVelaSimulator-${VER}.apk"
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: XiaomiVelaSimulator-*.apk
          fail_on_unmatched_files: true
